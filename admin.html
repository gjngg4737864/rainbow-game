<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0018;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 20px;
  }

  /* ===== LOGIN ===== */
  .login-box {
    max-width: 400px;
    margin: 40px auto 20px;
    background: linear-gradient(180deg, #1a0033, #0a0018);
    border: 1px solid #330066;
    border-radius: 16px;
    padding: 30px 25px;
    box-shadow: 0 0 40px rgba(150, 0, 255, 0.3);
  }
  .login-box h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 25px;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-box input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #150030;
    border: 2px solid #440080;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
  }
  .login-box input:focus { outline: none; border-color: #aa66ff; }
  .login-box button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, #6600cc, #aa00ff);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 20px rgba(150, 0, 255, 0.4);
  }
  .login-box button:disabled { background: #333; box-shadow: none; cursor: not-allowed; }
  .error-msg {
    color: #ff5577;
    font-size: 13px;
    text-align: center;
    margin-top: 15px;
    min-height: 18px;
    font-weight: 600;
  }

  /* ===== PANEL ===== */
  .panel { display: none; }
  .panel.show { display: block; }

  .top-header {
    background: linear-gradient(135deg, #330066, #1a0033);
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #440080;
  }
  .top-header .title { font-size: 16px; font-weight: 800; color: #cc88ff; }
  .top-header .role-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    background: #6600cc;
    margin-left: 6px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .top-header .role-badge.super { background: #ff6600; }
  .top-header .logout-btn {
    background: transparent;
    border: 1px solid #ff5577;
    color: #ff5577;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ===== TABS ===== */
  .tabs-row {
    display: flex;
    gap: 6px;
    padding: 15px;
    overflow-x: auto;
  }
  .tab-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    background: #150030;
    border: 1px solid #440080;
    color: #aa88cc;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: #6600cc;
    color: #fff;
    border-color: #aa66ff;
    box-shadow: 0 0 15px rgba(150, 0, 255, 0.5);
  }

  .tab-content { display: none; padding: 0 15px; }
  .tab-content.active { display: block; }

  /* ===== STATS ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 15px;
  }
  .stat-card {
    background: linear-gradient(135deg, #1a0033, #0a0018);
    border: 1px solid #440080;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
  }
  .stat-card .stat-icon { font-size: 22px; margin-bottom: 6px; }
  .stat-card .stat-value {
    font-size: 22px;
    font-weight: 800;
    color: #cc88ff;
    margin-bottom: 4px;
  }
  .stat-card .stat-label {
    font-size: 10px;
    color: #aa88cc;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ===== LIST CARDS ===== */
  .list-card {
    background: linear-gradient(135deg, #1a0033, #0a0018);
    border: 1px solid #440080;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
  }
  .list-item {
    padding: 12px 0;
    border-bottom: 1px solid #330066;
    font-size: 13px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .list-row .name { font-weight: 700; color: #fff; }
  .list-row .value { color: #cc88ff; font-weight: 700; }
  .list-row .meta { font-size: 11px; color: #8866aa; }
  .action-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .btn-sm {
    padding: 7px 12px;
    border: none;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
  }
  .btn-credit { background: #00a035; }
  .btn-debit { background: #cc5500; }
  .btn-block { background: #cc0055; }
  .btn-unblock { background: #0099cc; }
  .btn-approve { background: #00a035; }
  .btn-reject { background: #cc0055; }
  .btn-reset { background: #6600cc; }

  .empty-msg {
    text-align: center;
    padding: 30px 10px;
    color: #8866aa;
    font-size: 13px;
  }

  .refresh-btn {
    width: 100%;
    padding: 12px;
    background: #330066;
    border: 1px solid #6600cc;
    color: #cc88ff;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  /* ===== CREATE FORM ===== */
  .create-form {
    background: linear-gradient(135deg, #1a0033, #0a0018);
    border: 1px solid #440080;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .create-form h3 {
    font-size: 14px;
    color: #cc88ff;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .create-form input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #0a0018;
    border: 2px solid #440080;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
  }
  .create-form input:focus { outline: none; border-color: #aa66ff; }
  .create-form button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #00a035, #00cc44);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .create-form button:disabled { background: #333; cursor: not-allowed; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #333;
    color: #fff;
    padding: 12px 24px;
    border-radius: 25px;
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.3s;
    z-index: 999;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #00c853; }
  .toast.error { background: #ff4757; }
</style>
</head>
<body>

<!-- LOGIN BOX -->
<div class="login-box" id="loginBox">
  <h1>🔐 Admin Panel</h1>
  <input type="text" id="adminUser" placeholder="Admin Username" autocomplete="off">
  <input type="password" id="adminPass" placeholder="Password">
  <input type="password" id="adminKey" placeholder="Secret Key">
  <button id="loginBtn" onclick="adminLogin()">LOGIN</button>
  <div class="error-msg" id="loginError"></div>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
  <div class="top-header">
    <div class="title">
      <span id="adminName">Admin</span>
      <span class="role-badge" id="roleBadge">ADMIN</span>
    </div>
    <button class="logout-btn" onclick="adminLogout()">Logout</button>
  </div>

  <div class="tabs-row" id="tabsRow">
    <div class="tab-btn active" onclick="showTab('statsTab', this)">📊 Stats</div>
    <div class="tab-btn" onclick="showTab('playersTab', this)">👥 Players</div>
    <div class="tab-btn" onclick="showTab('pendingTab', this)">⏳ Pending</div>
    <div class="tab-btn" id="adminsTabBtn" onclick="showTab('adminsTab', this)" style="display:none;">🔑 Admins</div>
  </div>

  <!-- STATS -->
  <div class="tab-content active" id="statsTab">
    <button class="refresh-btn" onclick="loadStats()">🔄 Refresh Stats</button>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <!-- PLAYERS -->
  <div class="tab-content" id="playersTab">
    <button class="refresh-btn" onclick="loadPlayers()">🔄 Refresh Players</button>
    <div class="create-form" id="createPlayerForm">
      <h3>➕ Create New Player</h3>
      <input type="text" id="newPlayerUser" placeholder="Username" autocomplete="off" maxlength="20">
      <input type="password" id="newPlayerPass" placeholder="Password" maxlength="30">
      <input type="number" id="newPlayerBal" placeholder="Starting balance (default 100)" min="0">
      <button id="createPlayerBtn" onclick="createPlayer()">CREATE PLAYER</button>
    </div>
    <div class="list-card" id="playersList">
      <div class="empty-msg">Loading...</div>
    </div>
  </div>

  <!-- PENDING -->
  <div class="tab-content" id="pendingTab">
    <button class="refresh-btn" onclick="loadPending()">🔄 Refresh Pending</button>
    <div class="list-card" id="pendingList">
      <div class="empty-msg">Loading...</div>
    </div>
  </div>

  <!-- ADMINS (super admin only) -->
  <div class="tab-content" id="adminsTab">
    <button class="refresh-btn" onclick="loadAdmins()">🔄 Refresh Admins</button>
    <div class="create-form">
      <h3>➕ Create New Admin</h3>
      <input type="text" id="newAdminUser" placeholder="Admin username" autocomplete="off" maxlength="20">
      <input type="password" id="newAdminPass" placeholder="Password" maxlength="30">
      <input type="password" id="newAdminKey" placeholder="Secret Key (for admin login)" maxlength="50">
      <button id="createAdminBtn" onclick="createAdmin()">CREATE ADMIN</button>
    </div>
    <div class="list-card" id="adminsList">
      <div class="empty-msg">Loading...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';

  let adminToken = localStorage.getItem('adminToken') || '';
  let adminRole = localStorage.getItem('adminRole') || '';  // 'super' or 'sub'
  let adminUsername = localStorage.getItem('adminUsername') || '';

  if (adminToken) {
    showPanel();
  }

  // ===== ADMIN LOGIN =====
  async function adminLogin() {
    const username = document.getElementById('adminUser').value.trim();
    const password = document.getElementById('adminPass').value;
    const secretKey = document.getElementById('adminKey').value.trim();
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    errEl.textContent = '';
    if (!username || !password || !secretKey) {
      errEl.textContent = 'Teen cheezein daalo';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch(`${API}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, secretKey })
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.error || 'Login failed';
        btn.disabled = false;
        btn.textContent = 'LOGIN';
        return;
      }

      adminToken = data.token;
      adminRole = data.role;        // 'super' or 'sub'
      adminUsername = data.username;

      localStorage.setItem('adminToken', adminToken);
      localStorage.setItem('adminRole', adminRole);
      localStorage.setItem('adminUsername', adminUsername);

      showPanel();

    } catch (e) {
      errEl.textContent = 'Server error';
      btn.disabled = false;
      btn.textContent = 'LOGIN';
    }
  }

  function showPanel() {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').classList.add('show');
    document.getElementById('adminName').textContent = adminUsername;

    const badge = document.getElementById('roleBadge');
    if (adminRole === 'super') {
      badge.textContent = 'SUPER ADMIN';
      badge.classList.add('super');
      document.getElementById('adminsTabBtn').style.display = 'block';
    } else {
      badge.textContent = 'ADMIN';
    }

    loadStats();
    loadPlayers();
    loadPending();
    if (adminRole === 'super') loadAdmins();
  }

  function adminLogout() {
    if (confirm('Logout karna hai?')) {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminRole');
      localStorage.removeItem('adminUsername');
      location.reload();
    }
  }

  // ===== API HELPER =====
  async function api(path, opts = {}) {
    const res = await fetch(`${API}/api/admin${path}`, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + adminToken,
        ...(opts.headers || {})
      }
    });
    if (res.status === 401 || res.status === 403) {
      showToast('Session expired. Login again.', 'error');
      localStorage.removeItem('adminToken');
      setTimeout(() => location.reload(), 1500);
      throw new Error('Unauthorized');
    }
    return res;
  }

  async function superApi(path, opts = {}) {
    const res = await fetch(`${API}/api/superadmin${path}`, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + adminToken,
        ...(opts.headers || {})
      }
    });
    if (res.status === 401 || res.status === 403) {
      showToast('Session expired.', 'error');
      throw new Error('Unauthorized');
    }
    return res;
  }

  // ===== TABS =====
  function showTab(tabId, el) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
  }

  // ===== STATS =====
  async function loadStats() {
    try {
      const res = await api('/stats');
      const data = await res.json();
      const grid = document.getElementById('statsGrid');
      grid.innerHTML = `
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-value">${data.totalPlayers || 0}</div>
          <div class="stat-label">My Players</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎮</div>
          <div class="stat-value">${data.totalBets || 0}</div>
          <div class="stat-label">Total Bets</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-value">₹${(data.totalBetAmount || 0).toFixed(0)}</div>
          <div class="stat-label">Bet Volume</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-value">₹${(data.totalPayout || 0).toFixed(0)}</div>
          <div class="stat-label">Total Payout</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <div class="stat-value" style="color:${data.profit >= 0 ? '#00ff88' : '#ff5577'}">₹${(data.profit || 0).toFixed(0)}</div>
          <div class="stat-label">Profit</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-value">${data.pendingTx || 0}</div>
          <div class="stat-label">Pending</div>
        </div>
      `;
    } catch (e) { console.log(e); }
  }

  // ===== PLAYERS =====
  async function loadPlayers() {
    try {
      const res = await api('/players');
      const users = await res.json();
      const el = document.getElementById('playersList');
      if (!users.length) {
        el.innerHTML = '<div class="empty-msg">No players yet. Create one above.</div>';
        return;
      }
      el.innerHTML = '';
      users.forEach(u => {
        const item = document.createElement('div');
        item.className = 'list-item';
        const date = new Date(u.createdAt).toLocaleDateString('en-IN');
        item.innerHTML = `
          <div class="list-row">
            <span class="name">${u.username} ${u.isBlocked ? '🚫' : '✅'}</span>
            <span class="value">₹${u.balance.toFixed(2)}</span>
          </div>
          <div class="list-row">
            <span class="meta">Joined: ${date}</span>
            <span class="meta">ID: ${u._id.slice(-6)}</span>
          </div>
          <div class="action-row">
            <button class="btn-sm btn-credit" onclick="creditUser('${u._id}', '${u.username}')">+ Credit</button>
            <button class="btn-sm btn-debit" onclick="debitUser('${u._id}', '${u.username}')">- Debit</button>
            <button class="btn-sm ${u.isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${u._id}', ${!u.isBlocked})">${u.isBlocked ? 'Unblock' : 'Block'}</button>
            <button class="btn-sm btn-reset" onclick="resetPass('${u._id}', '${u.username}')">Reset Pass</button>
          </div>
        `;
        el.appendChild(item);
      });
    } catch (e) {
      document.getElementById('playersList').innerHTML = '<div class="empty-msg">Error loading</div>';
    }
  }

  async function createPlayer() {
    const username = document.getElementById('newPlayerUser').value.trim();
    const password = document.getElementById('newPlayerPass').value;
    const balance = parseFloat(document.getElementById('newPlayerBal').value) || 100;

    if (!username || !password) {
      showToast('Username aur password daalo', 'error');
      return;
    }
    if (username.length < 3 || password.length < 4) {
      showToast('Username 3+ aur password 4+ chahiye', 'error');
      return;
    }

    const btn = document.getElementById('createPlayerBtn');
    btn.disabled = true;
    btn.textContent = 'Creating...';

    try {
      const res = await api('/player', {
        method: 'POST',
        body: JSON.stringify({ username, password, balance })
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || 'Failed', 'error');
        btn.disabled = false;
        btn.textContent = 'CREATE PLAYER';
        return;
      }
      showToast('✅ Player created', 'success');
      document.getElementById('newPlayerUser').value = '';
      document.getElementById('newPlayerPass').value = '';
      document.getElementById('newPlayerBal').value = '';
      btn.disabled = false;
      btn.textContent = 'CREATE PLAYER';
      loadPlayers();
      loadStats();
    } catch (e) {
      showToast('Server error', 'error');
      btn.disabled = false;
      btn.textContent = 'CREATE PLAYER';
    }
  }

  async function creditUser(id, uname) {
    const amt = prompt(`Kitna credit karna hai ${uname} ko?`);
    if (!amt || isNaN(amt) || amt <= 0) return;
    try {
      await api(`/player/${id}/balance`, {
        method: 'POST',
        body: JSON.stringify({ amount: parseFloat(amt) })
      });
      showToast(`✅ ₹${amt} credited`, 'success');
      loadPlayers();
      loadStats();
    } catch (e) {}
  }

  async function debitUser(id, uname) {
    const amt = prompt(`Kitna debit karna hai ${uname} se?`);
    if (!amt || isNaN(amt) || amt <= 0) return;
    try {
      await api(`/player/${id}/balance`, {
        method: 'POST',
        body: JSON.stringify({ amount: -parseFloat(amt) })
      });
      showToast(`✅ ₹${amt} debited`, 'success');
      loadPlayers();
      loadStats();
    } catch (e) {}
  }

  async function toggleBlock(id, block) {
    if (!confirm(block ? 'Block karna hai?' : 'Unblock karna hai?')) return;
    try {
      await api(`/player/${id}/block`, {
        method: 'POST',
        body: JSON.stringify({ block })
      });
      showToast(block ? '🚫 Blocked' : '✅ Unblocked', 'success');
      loadPlayers();
    } catch (e) {}
  }

  async function resetPass(id, uname) {
    const newPass = prompt(`Naya password ${uname} ke liye (4+ chars):`);
    if (!newPass || newPass.length < 4) return;
    try {
      await api(`/player/${id}/password`, {
        method: 'POST',
        body: JSON.stringify({ password: newPass })
      });
      showToast(`✅ Password reset for ${uname}`, 'success');
    } catch (e) {}
  }

  // ===== PENDING =====
  async function loadPending() {
    try {
      const res = await api('/pending');
      const txs = await res.json();
      const el = document.getElementById('pendingList');
      if (!txs.length) {
        el.innerHTML = '<div class="empty-msg">No pending requests</div>';
        return;
      }
      el.innerHTML = '';
      txs.forEach(tx => {
        const item = document.createElement('div');
        item.className = 'list-item';
        const date = new Date(tx.createdAt).toLocaleString('en-IN', {
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
        item.innerHTML = `
          <div class="list-row">
            <span class="name">${tx.userId?.username || 'Unknown'}</span>
            <span class="value">₹${tx.amount}</span>
          </div>
          <div class="list-row">
            <span class="meta">${tx.type.toUpperCase()}</span>
            <span class="meta">${date}</span>
          </div>
          ${tx.note ? `<div class="list-row"><span class="meta">Note: ${tx.note}</span></div>` : ''}
          <div class="action-row">
            <button class="btn-sm btn-approve" onclick="txAction('${tx._id}', 'approve')">✅ Approve</button>
            <button class="btn-sm btn-reject" onclick="txAction('${tx._id}', 'reject')">❌ Reject</button>
          </div>
        `;
        el.appendChild(item);
      });
    } catch (e) {
      document.getElementById('pendingList').innerHTML = '<div class="empty-msg">Error</div>';
    }
  }

  async function txAction(id, action) {
    if (!confirm(`${action === 'approve' ? 'Approve' : 'Reject'}?`)) return;
    try {
      await api(`/transaction/${id}`, {
        method: 'POST',
        body: JSON.stringify({ action })
      });
      showToast(action === 'approve' ? '✅ Approved' : '❌ Rejected', 'success');
      loadPending();
      loadPlayers();
      loadStats();
    } catch (e) {}
  }

  // ===== ADMINS (super only) =====
  async function loadAdmins() {
    try {
      const res = await superApi('/admins');
      const admins = await res.json();
      const el = document.getElementById('adminsList');
      if (!admins.length) {
        el.innerHTML = '<div class="empty-msg">No admins yet</div>';
        return;
      }
      el.innerHTML = '';
      admins.forEach(a => {
        const item = document.createElement('div');
        item.className = 'list-item';
        const date = new Date(a.createdAt).toLocaleDateString('en-IN');
        item.innerHTML = `
          <div class="list-row">
            <span class="name">${a.username} ${a.isBlocked ? '🚫' : '✅'} ${a.isSuperAdmin ? '⭐' : ''}</span>
            <span class="meta">${a.playerCount || 0} players</span>
          </div>
          <div class="list-row">
            <span class="meta">Joined: ${date}</span>
            <span class="meta">${a.isSuperAdmin ? 'SUPER ADMIN' : 'ADMIN'}</span>
          </div>
          ${!a.isSuperAdmin ? `
          <div class="action-row">
            <button class="btn-sm btn-reset" onclick="resetAdminPass('${a._id}', '${a.username}')">Reset Pass</button>
            <button class="btn-sm ${a.isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleAdminBlock('${a._id}', ${!a.isBlocked})">${a.isBlocked ? 'Unblock' : 'Block'}</button>
          </div>
          ` : ''}
        `;
        el.appendChild(item);
      });
    } catch (e) {
      document.getElementById('adminsList').innerHTML = '<div class="empty-msg">Error</div>';
    }
  }

  async function createAdmin() {
    const username = document.getElementById('newAdminUser').value.trim();
    const password = document.getElementById('newAdminPass').value;
    const secretKey = document.getElementById('newAdminKey').value.trim();

    if (!username || !password || !secretKey) {
      showToast('Teen cheezein daalo', 'error');
      return;
    }

    const btn = document.getElementById('createAdminBtn');
    btn.disabled = true;
    btn.textContent = 'Creating...';

    try {
      const res = await superApi('/admin', {
        method: 'POST',
        body: JSON.stringify({ username, password, secretKey })
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || 'Failed', 'error');
        btn.disabled = false;
        btn.textContent = 'CREATE ADMIN';
        return;
      }
      showToast('✅ Admin created', 'success');
      document.getElementById('newAdminUser').value = '';
      document.getElementById('newAdminPass').value = '';
      document.getElementById('newAdminKey').value = '';
      btn.disabled = false;
      btn.textContent = 'CREATE ADMIN';
      loadAdmins();
    } catch (e) {
      showToast('Server error', 'error');
      btn.disabled = false;
      btn.textContent = 'CREATE ADMIN';
    }
  }

  async function resetAdminPass(id, uname) {
    const newPass = prompt(`Naya password for admin ${uname}:`);
    if (!newPass || newPass.length < 4) return;
    try {
      await superApi(`/admin/${id}/password`, {
        method: 'POST',
        body: JSON.stringify({ password: newPass })
      });
      showToast('✅ Admin password reset', 'success');
    } catch (e) {}
  }

  async function toggleAdminBlock(id, block) {
    if (!confirm(block ? 'Admin ko block karna hai?' : 'Unblock?')) return;
    try {
      await superApi(`/admin/${id}/block`, {
        method: 'POST',
        body: JSON.stringify({ block })
      });
      showToast(block ? '🚫 Admin blocked' : '✅ Admin unblocked', 'success');
      loadAdmins();
    } catch (e) {}
  }

  // ===== TOAST =====
  let toastTimer;
  function showToast(text, type) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
